allowBuilds:
  "@parcel/watcher": true
  supabase: true
  unrs-resolver: true
overrides:
  # 상위 도구의 API를 유지한 채 coverage 경로를 glob 13으로 옮긴다.
  # test-exclude 8의 변경은 Node 20 이상 요구와 glob 갱신이다.
  "babel-plugin-istanbul@8.0.0>test-exclude": 8.0.0
  # glob 13 계열 소비 API를 유지하면서 AbortSignal 취소 수정을 반영한다.
  "glob@>=13.0.0 <14.0.3": 14.0.3
  "minimatch@>=10.0.0 <11.0.1": 11.0.4
  "js-yaml@>=3.0.0 <3.15.2": 3.15.2
  "semver@>=7.0.0 <7.5.2": 7.8.5
  "brace-expansion@>=1.0.0 <1.1.21": 1.1.21
  "brace-expansion@>=2.0.0 <2.1.7": 2.1.7
  "brace-expansion@>=5.0.0 <5.0.12": 5.0.12
  "qs@<6.16.1": 6.16.1
  "ws@>=8.0.0 <8.20.1": 8.21.0
  "browserslist@<4.28.7": 4.28.7
  "baseline-browser-mapping@<2.11.0": 2.11.0
