name: Dependency checks

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dependency-checks.yml
      - scripts/dependency-security.test.cjs
      - NextPractice/hello/**
      - NodeJSPractice/hello_ts/**
      - NodeJSPractice/practice/**
      - NodeJSPractice/supabase/**
      - NodeJSPractice/test/**
      - ReactPractice/my-app/**
      - RabbitMQPractice/**
  pull_request:
    paths:
      - .github/workflows/dependency-checks.yml
      - scripts/dependency-security.test.cjs
      - NextPractice/hello/**
      - NodeJSPractice/hello_ts/**
      - NodeJSPractice/practice/**
      - NodeJSPractice/supabase/**
      - NodeJSPractice/test/**
      - ReactPractice/my-app/**
      - RabbitMQPractice/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: NextPractice/hello
            security: true
            check: pnpm lint && pnpm build
          - project: NodeJSPractice/hello_ts
            security: true
            check: pnpm check
          - project: NodeJSPractice/supabase
            security: true
            check: pnpm check
          - project: NodeJSPractice/practice
            security: true
            check: pnpm check
          - project: NodeJSPractice/test
            check: node --check index.js
          - project: ReactPractice/my-app
            check: pnpm check
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.13.1
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ matrix.project }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.check }}
      - name: Verify dependency security and caller compatibility
        if: matrix.security
        run: node --test "$GITHUB_WORKSPACE/scripts/dependency-security.test.cjs"
      - name: Verify the Express example responds with a UUID
        if: matrix.project == 'NodeJSPractice/test'
        run: |
          node index.js > "$RUNNER_TEMP/example.log" 2>&1 &
          example_pid=$!
          trap 'kill "$example_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/ > "$RUNNER_TEMP/example-response.txt"; then
              node -e 'const assert = require("node:assert/strict"); const fs = require("node:fs"); const value = fs.readFileSync(process.argv[1], "utf8"); assert.match(value, /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);' "$RUNNER_TEMP/example-response.txt"
              exit 0
            fi
            sleep 0.25
          done
          cat "$RUNNER_TEMP/example.log"
          exit 1

  rabbitmq:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: RabbitMQPractice
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: RabbitMQPractice/go.mod
          cache-dependency-path: RabbitMQPractice/go.sum
      - run: go vet ./...
      - run: go test ./...
