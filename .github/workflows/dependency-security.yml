name: Dependency security

on:
  push:
    branches: [main]
    paths:
      - '**/pnpm-lock.yaml'
      - '**/package.json'
      - '**/pnpm-workspace.yaml'
      - RabbitMQPractice/go.mod
      - RabbitMQPractice/go.sum
      - SkaffoldPractice/go.mod
      - SkaffoldPractice/Dockerfile
      - security/**
      - scripts/audit-dependencies*
      - .github/workflows/dependency-security.yml
  pull_request:
    paths:
      - '**/pnpm-lock.yaml'
      - '**/package.json'
      - '**/pnpm-workspace.yaml'
      - RabbitMQPractice/go.mod
      - RabbitMQPractice/go.sum
      - SkaffoldPractice/go.mod
      - SkaffoldPractice/Dockerfile
      - security/**
      - scripts/audit-dependencies*
      - .github/workflows/dependency-security.yml
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-audit:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.12.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
      - run: node --test scripts/audit-dependencies.test.cjs
      - run: node scripts/audit-dependencies.cjs

  go-audit:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - module: RabbitMQPractice
            scan: RabbitMQPractice/pkg/mq
          - module: SkaffoldPractice
            scan: SkaffoldPractice
    defaults:
      run:
        working-directory: ${{ matrix.scan }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.*
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -scan=module
